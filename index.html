<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Status gry Roblox</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #111827, #1e293b);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 30px;
      text-shadow: 0 0 10px #00a2ff;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      width: 320px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
    }

    .value {
      font-size: 2rem;
      font-weight: bold;
      margin: 10px 0;
      color: #00bfff;
    }

    .label {
      font-size: 1rem;
      color: #cbd5e1;
    }

    .buttons {
      margin-top: 25px;
    }

    button {
      background: linear-gradient(135deg, #00a2ff, #007acc);
      border: none;
      border-radius: 10px;
      padding: 12px 25px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 5px;
    }

    button:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #0ea5e9, #0369a1);
    }

    #czas {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <h1>Status twojej gry Roblox</h1>

  <div class="card">
    <div id="online" class="value">0</div>
    <div class="label">Graczy teraz online</div>
    <div id="visits" class="value" style="margin-top:20px;">0</div>
    <div class="label">Łączna liczba graczy</div>
    <div class="buttons">
      <button onclick="pokazOnline()">👥 Odśwież online</button>
      <button onclick="pokazVisits()">📊 Odśwież odwiedziny</button>
    </div>
    <div id="czas"></div>
  </div>

  <footer>© 2025 dc frvvnek_</footer>

  <script>
    const gameId = "90166277380078";

    async function pobierzDane() {
      const res = await fetch(`https://games.roblox.com/v1/games?universeIds=${gameId}`);
      const data = await res.json();
      return data.data[0];
    }

    async function pokazOnline() {
      const info = await pobierzDane();
      const count = info?.playing || 0;
      document.getElementById("online").textContent = count.toLocaleString();
      aktualizujCzas();
    }

    async function pokazVisits() {
      const info = await pobierzDane();
      const visits = info?.visits || 0;
      document.getElementById("visits").textContent = visits.toLocaleString();
      aktualizujCzas();
    }

    async function autoUpdate() {
      const info = await pobierzDane();
      const count = info?.playing || 0;
      const visits = info?.visits || 0;
      document.getElementById("online").textContent = count.toLocaleString();
      document.getElementById("visits").textContent = visits.toLocaleString();
      aktualizujCzas();
    }

    function aktualizujCzas() {
      document.getElementById("czas").textContent = 
        "🔄 Ostatnia aktualizacja: " + new Date().toLocaleTimeString();
    }

    // Auto-update co 5 sekund
    autoUpdate();
    setInterval(autoUpdate, 5000);
  </script>
</body>
</html>
