<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Panel Kasy Roblox</title>
  <style>
    body{font-family:Arial;padding:20px;background:#f4f4f8}
    .card{max-width:520px;margin:auto;padding:20px;background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
    input,button{width:100%;padding:10px;margin:6px 0;font-size:15px;box-sizing:border-box}
    .row{display:flex;gap:8px}
    .row>button{flex:1}
    .small{font-size:13px;color:#555}
    label{font-size:13px;color:#333}
  </style>
</head>
<body>
  <div class="card">
    <h2>Panel Kasy — Roblox</h2>
    <div class="small">Wpisz dokładny nick gracza (Name). Kliknij Dodaj/Odejmij.</div>

    <label>Nazwa gracza</label>
    <input id="playerName" placeholder="np. Franek828">

    <label>Ilość (liczba)</label>
    <input id="amount" type="number" placeholder="np. 100">

    <div class="row">
      <button id="addBtn">➕ Dodaj kasę</button>
      <button id="subBtn">➖ Odejmij kasę</button>
    </div>

    <label>Firebase DB URL</label>
    <input id="firebaseUrl" value="https://money-731d4-default-rtdb.europe-west1.firebasedatabase.app">

    <label>Secret Key</label>
    <input id="secretKey" value="koperek">

    <div id="status" class="small"></div>
  </div>

<script>
(() => {
  const addBtn = document.getElementById('addBtn');
  const subBtn = document.getElementById('subBtn');
  const status = document.getElementById('status');

  function getFirebaseUrl(){ return document.getElementById('firebaseUrl').value.trim(); }
  function getSecretKey(){ return document.getElementById('secretKey').value.trim(); }

  async function sendCommand(playerName, amount, action){
    status.textContent = '';
    if(!playerName){ status.textContent = 'Wpisz nazwę gracza.'; return; }
    if(amount === '' || isNaN(amount)){ status.textContent = 'Wpisz poprawną ilość.'; return; }
    const base = getFirebaseUrl();
    if(!base){ status.textContent = 'Wklej URL Firebase.'; return; }

    const payload = {
      playerName: playerName,
      action: action,
      amount: Number(amount),
      createdAt: Date.now(),
      secretKey: getSecretKey()
    };

    try {
      const res = await fetch(base + '/commands.json', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      if(!res.ok){
        const text = await res.text();
        throw new Error(text || res.statusText);
      }
      status.textContent = `Wysłano: ${action} ${amount} -> ${playerName}`;
    } catch(e){
      status.textContent = 'Błąd wysyłania: ' + e.message;
      console.error(e);
    }
  }

  addBtn.onclick = ()=> sendCommand(
    document.getElementById('playerName').value.trim(),
    document.getElementById('amount').value.trim(),
    'add'
  );
  subBtn.onclick = ()=> sendCommand(
    document.getElementById('playerName').value.trim(),
    document.getElementById('amount').value.trim(),
    'sub'
  );
})();
</script>
</body>
</html>
