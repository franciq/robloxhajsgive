<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 Panel Kasy Roblox 💰</title>
<style>
  body {
    background: #0e0e0e;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 50px;
  }
  input, button {
    padding: 10px;
    margin: 10px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
  }
  input {
    width: 200px;
  }
  button {
    background: #00c853;
    color: white;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover {
    background: #00e676;
  }
  .minus {
    background: #d50000;
  }
  .minus:hover {
    background: #ff1744;
  }
  table {
    margin: 30px auto;
    border-collapse: collapse;
    width: 60%;
  }
  th, td {
    border: 1px solid #444;
    padding: 8px;
  }
  th {
    background: #1c1c1c;
  }
  tr:nth-child(even) {
    background: #181818;
  }
</style>
</head>
<body>
  <h1>💸 Panel zarządzania kasą graczy 💸</h1>
  <input id="playerName" type="text" placeholder="Nazwa gracza"><br>
  <input id="amount" type="number" placeholder="Ilość"><br>
  <button onclick="addMoney()">➕ Dodaj kasę</button>
  <button class="minus" onclick="removeMoney()">➖ Odejmij kasę</button>

  <h2>🏆 Stan kont graczy</h2>
  <table id="moneyTable">
    <thead>
      <tr><th>Gracz</th><th>Kasa</th></tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
  const firebaseUrl = "https://money-731d4-default-rtdb.europe-west1.firebasedatabase.app";

  // 🟢 Dodaj kasę
  async function addMoney() {
    const player = document.getElementById("playerName").value.trim();
    const amount = parseInt(document.getElementById("amount").value);
    if (!player || isNaN(amount)) return alert("Uzupełnij wszystkie pola!");

    await fetch(`${firebaseUrl}/commands.json`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ player, action: "add", amount })
    });

    alert(`Dodano ${amount} graczowi ${player}`);
  }

  // 🔴 Odejmij kasę
  async function removeMoney() {
    const player = document.getElementById("playerName").value.trim();
    const amount = parseInt(document.getElementById("amount").value);
    if (!player || isNaN(amount)) return alert("Uzupełnij wszystkie pola!");

    await fetch(`${firebaseUrl}/commands.json`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ player, action: "remove", amount })
    });

    alert(`Odjęto ${amount} graczowi ${player}`);
  }

  // 🔁 Aktualizacja tabeli w czasie rzeczywistym
  async function updateTable() {
    const res = await fetch(`${firebaseUrl}/players.json`);
    const data = await res.json();
    const tbody = document.querySelector("#moneyTable tbody");
    tbody.innerHTML = "";

    if (data) {
      Object.entries(data).forEach(([name, value]) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${name}</td><td>${value}</td>`;
        tbody.appendChild(tr);
      });
    } else {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="2">Brak danych</td>`;
      tbody.appendChild(tr);
    }
  }

  // Odśwież co 5 sekund
  setInterval(updateTable, 5000);
  updateTable();
</script>
</body>
</html>
